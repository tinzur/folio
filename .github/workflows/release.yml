name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (empty: uses Cargo.toml version)"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  # -----------------------------------------------------------------------------------------------
  # macOS (Apple Silicon Only: aarch64)
  # -----------------------------------------------------------------------------------------------
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build and Package DMG
        env:
          PDFCRAFT_VERSION: ${{ inputs.version }}
          PDFCRAFT_SKIP_MODELS: "1"
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/macos/package.sh packaging/env.sh
          ./packaging/macos/package.sh --arch aarch64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Windows (x86_64)
  # -----------------------------------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binaries
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc

      - name: Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          $ver = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "20.0.1" }
          $zipPath = "dist/release/folio-$ver-windows-x86_64.zip"
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/pdfcraft.exe, target/x86_64-pc-windows-msvc/release/pdfcraft-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath $zipPath
          Get-ChildItem dist/release/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Linux (x86_64)
  # -----------------------------------------------------------------------------------------------
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binaries
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-unknown-linux-gnu

      - name: Package Linux Tarball
        run: |
          mkdir -p dist/release
          VER="${{ inputs.version }}"
          [ -z "$VER" ] && VER="20.0.1"
          TAR_DIR="folio-$VER-linux-x86_64"
          mkdir -p "$TAR_DIR"
          cp target/x86_64-unknown-linux-gnu/release/pdfcraft "$TAR_DIR/folio"
          cp target/x86_64-unknown-linux-gnu/release/pdfcraft-cli "$TAR_DIR/folio-cli"
          cp README.md LICENSE-MIT LICENSE-APACHE "$TAR_DIR/"
          tar -czf "dist/release/folio-$VER-linux-x86_64.tar.gz" "$TAR_DIR"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Publish GitHub Release
  # -----------------------------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

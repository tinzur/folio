name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (empty: uses Cargo.toml version)"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  # -----------------------------------------------------------------------------------------------
  # macOS (Apple Silicon Only: aarch64)
  # -----------------------------------------------------------------------------------------------
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build and Package DMG
        env:
          PDFCRAFT_VERSION: ${{ inputs.version }}
          PDFCRAFT_SKIP_MODELS: "1"
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x packaging/macos/package.sh packaging/env.sh
          ./packaging/macos/package.sh --arch aarch64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Windows (x86_64)
  # -----------------------------------------------------------------------------------------------
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binaries
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-pc-windows-msvc

      - name: Package Windows Artifacts (Direct .exe + Portable .zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          $ver = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "20.0.1" }
          $exePath = "dist/release/folio-$ver-windows-x86_64.exe"
          $zipPath = "dist/release/folio-$ver-windows-x86_64.zip"
          Copy-Item target/x86_64-pc-windows-msvc/release/pdfcraft.exe target/x86_64-pc-windows-msvc/release/folio.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/pdfcraft-cli.exe target/x86_64-pc-windows-msvc/release/folio-cli.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/folio.exe $exePath
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/folio.exe, target/x86_64-pc-windows-msvc/release/folio-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath $zipPath
          Get-ChildItem dist/release/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Windows (ARM64)
  # -----------------------------------------------------------------------------------------------
  build-windows-arm64:
    name: Windows (ARM64)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Build Release Binaries
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target aarch64-pc-windows-msvc

      - name: Package Windows ARM64 (Direct .exe + Portable .zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release
          $ver = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "20.0.1" }
          $exePath = "dist/release/folio-$ver-windows-arm64.exe"
          $zipPath = "dist/release/folio-$ver-windows-arm64.zip"
          Copy-Item target/aarch64-pc-windows-msvc/release/pdfcraft.exe target/aarch64-pc-windows-msvc/release/folio.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/pdfcraft-cli.exe target/aarch64-pc-windows-msvc/release/folio-cli.exe
          Copy-Item target/aarch64-pc-windows-msvc/release/folio.exe $exePath
          Compress-Archive -Path target/aarch64-pc-windows-msvc/release/folio.exe, target/aarch64-pc-windows-msvc/release/folio-cli.exe, README.md, LICENSE-MIT, LICENSE-APACHE -DestinationPath $zipPath
          Get-ChildItem dist/release/

      - name: Upload Windows ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Linux (x86_64: deb, rpm, tar)
  # -----------------------------------------------------------------------------------------------
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev rpm zsync flatpak flatpak-builder librsvg2-common
          curl -sL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          which nfpm
          nfpm --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binaries
        run: cargo build --release --locked -p pdfcraft -p pdfcraft-cli --target x86_64-unknown-linux-gnu

      - name: Package Linux Formats (deb, rpm, AppImage, tar, flatpak)
        env:
          PDFCRAFT_SKIP_MODELS: "1"
          CROSS_TARGET: x86_64-unknown-linux-gnu
        run: |
          chmod +x packaging/linux/package.sh packaging/linux/flatpak-bundle.sh packaging/env.sh
          ./packaging/linux/package.sh --skip-build --formats "appimage deb rpm tar cli"
          ./packaging/linux/flatpak-bundle.sh --no-test || echo "Flatpak bundle generation skipped"
          ls -lh dist/release/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/release/*

  # -----------------------------------------------------------------------------------------------
  # Publish GitHub Release
  # -----------------------------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows, build-windows-arm64, build-linux]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
